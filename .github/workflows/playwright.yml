name: EV API CI Pipeline

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

jobs:
    test:
        timeout-minutes: 15
        runs-on: ubuntu-latest
        env:
            # Opt-in to Node.js 24 for JavaScript actions
            FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: "npm"

            - name: Install Dependencies
              run: npm ci

            - name: Start Infrastructure (Docker Compose)
              # Using 'docker compose' (V2) for modern CI runners
              run: docker compose up -d --build

            - name: Show Docker Logs (If Start Fails)
              # Crucial for debugging OOM or container crash issues in CI
              if: failure()
              run: docker compose logs

            - name: Wait for Kafka Readiness
              # Polling port 9092 via TCP until the broker is ready
              run: |
                  echo "Waiting for Kafka to be ready on localhost:9092..."
                  for i in $(seq 1 30); do
                    if nc -z localhost 9092 2>/dev/null; then
                      echo "✅ Kafka is ready after ${i} attempts"
                      exit 0
                    fi
                    echo "Attempt ${i}/30 — Kafka not yet ready, retrying in 5s..."
                    sleep 5
                  done
                  echo "❌ Kafka failed to become ready in time"
                  exit 1

            - name: Wait for API Readiness
              # Running custom startup probe to ensure DB and API are fully synced
              run: npm run docker:wait

            - name: Run Playwright Tests
              run: npx playwright test
              env:
                  API_BASE_URL: http://localhost:3000
                  # Suppress KafkaJS partitioner migration warnings in CI logs
                  KAFKAJS_NO_PARTITIONER_WARNING: "1"

            - name: Upload Playwright Report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 10

            - name: Upload Allure Results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: allure-results
                  path: allure-results/
                  retention-days: 10

            - name: Stop Containers
              if: always()
              run: docker compose down
