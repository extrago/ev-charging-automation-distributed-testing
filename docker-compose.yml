version: '3.8'

networks:
  ev-net:
    driver: bridge

services:
  # --- DATABASE LAYER ---
  db:
    image: postgis/postgis:15-3.3
    container_name: ev_postgis
    environment:
      POSTGRES_USER: ev_user
      POSTGRES_PASSWORD: ev_secret
      POSTGRES_DB: ev_charging
    volumes:
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - ev-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ev_user -d ev_charging"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --- APPLICATION LAYER ---
  api:
    build:
      context: ./docker/api
      dockerfile: Dockerfile
    container_name: ev_api
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ev_user
      DB_PASSWORD: ev_secret
      DB_NAME: ev_charging
      KAFKA_BROKER: kafka:29092
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: truck-telemetry
      TELEMETRY_TOPIC: truck-telemetry
      PORT: 3000
    ports:
      - "3000:3000"
    networks:
      - ev-net
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # --- MESSAGING LAYER ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: ev_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      # Limit memory usage to prevent Out-Of-Memory (OOM) kills in CI
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms256M"
    # Exposing the port ensures connection stability in the CI environment
    ports:
      - "2181:2181"
    networks:
      - ev-net
    healthcheck:
      # Simple and bulletproof port check
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: ev_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Limit memory usage to prevent OOM kills in CI
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
      # --- CI Stability Settings (Single Node Mode) ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - ev-net
    healthcheck:
      # Simple and bulletproof port check
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s