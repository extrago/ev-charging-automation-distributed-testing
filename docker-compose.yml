version: '3.8'

# Custom bridge network for isolated and secure service communication
networks:
  ev-net:
    driver: bridge

services:
  # --- DATABASE LAYER ---
  # PostGIS: Extends PostgreSQL with support for geographic objects
  db:
    image: postgis/postgis:15-3.3
    container_name: ev_postgis
    environment:
      POSTGRES_USER: ev_user
      POSTGRES_PASSWORD: ev_secret
      POSTGRES_DB: ev_charging
    volumes:
      # Automatically executes init.sql to setup schema and spatial indices
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432" # Exposed for Playwright DB assertions and DBeaver
    networks:
      - ev-net
    healthcheck:
      # Critical: Ensures the database is ready to accept connections
      test: ["CMD-SHELL", "pg_isready -U ev_user -d ev_charging"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --- APPLICATION LAYER ---
  # The Backend API under test
  api:
    build:
      context: ./docker/api
      dockerfile: Dockerfile
    container_name: ev_api
    environment:
      # Database Connection Strings
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ev_user
      DB_PASSWORD: ev_secret
      DB_NAME: ev_charging
      
      # Kafka Configuration (Unified to fix Consumer silence)
      KAFKA_BROKER: kafka:29092
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      
      # Topic Mapping: Ensures API listens to the same topic used by Playwright
      KAFKA_TOPIC: truck-telemetry
      TELEMETRY_TOPIC: truck-telemetry
      
      PORT: 3000
    ports:
      - "3000:3000" # Main entry point for API testing
    networks:
      - ev-net
    depends_on:
      db:
        condition: service_healthy # Wait for PostGIS to be ready
      kafka:
        condition: service_started # Ensure Kafka is up before API starts listening
    healthcheck:
      # Verifies the API is alive and responding to health probes
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # --- MESSAGING LAYER ---
  # Zookeeper: Handles cluster coordination and leader election
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: ev_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ev-net

  # Kafka: High-performance message broker for telemetry events
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: ev_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092" # Port for Host access (Playwright Producer)
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Listener Strategy: 29092 for Internal (API), 9092 for External (Tests)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - ev-net